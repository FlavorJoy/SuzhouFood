# .github/workflows/update-sql.yml
name: Update SQL from CSV

on:
  push:
    paths:
      - 'food-original.csv'
      - 'data/*.csv'
      - '.github/workflows/update-sql.yml'
      - '../../export_to_sql.py'
    branches:
      - main
      - master
  pull_request:
    paths:
      - 'food-original.csv'
      - 'data/*.csv'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  generate-sql:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      # 2. 设置 Python（使用内置缓存）
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt not found, skipping pip install"
          fi

      # 4. 调试：列出文件结构
      - name: Debug - List files
        run: |
          echo "Current directory:"
          ls -la
          echo ""
          echo "Scripts directory:"
          ls -la scripts/ 2>/dev/null || echo "scripts/ directory not found"
          echo ""
          echo "CSV files:"
          ls -la *.csv 2>/dev/null || echo "No CSV files in root"
          echo ""
          echo "Data directory:"
          ls -la data/ 2>/dev/null || echo "data/ directory not found"

      # 5. 生成 SQL
      - name: Generate SQL from CSV
        id: generate
        run: |
          # 检查脚本是否存在
          if [ ! -f "scripts/export_to_sql.py" ]; then
            echo "❌ scripts/export_to_sql.py not found!"
            exit 1
          fi
          
          # 检查 CSV 文件是否存在
          if [ ! -f "food-original.csv" ] && [ ! -f "data/food.csv" ]; then
            echo "❌ No CSV file found!"
            echo "Available files:"
            find . -name "*.csv" -type f
            exit 1
          fi
          
          # 设置环境变量
          export CSV_PATH="${CSV_PATH:-food-original.csv}"
          export SQL_PATH="${SQL_PATH:-data/food.sql}"
          
          echo "Using CSV_PATH: $CSV_PATH"
          echo "Using SQL_PATH: $SQL_PATH"
          
          # 创建数据目录
          mkdir -p data
          
          # 运行脚本
          python scripts/export_to_sql.py
          
          # 检查是否生成了 SQL 文件
          if [ -f "data/food.sql" ]; then
            echo "✅ SQL file generated successfully"
            echo "generated=true" >> $GITHUB_OUTPUT
            echo "SQL file size: $(wc -l < data/food.sql) lines"
          else
            echo "❌ Failed to generate SQL file"
            echo "generated=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 6. 检查变更
      - name: Check for changes
        id: changes
        run: |
          if [ -f "data/food.sql" ]; then
            if git diff --quiet data/food.sql; then
              echo "changes=false" >> $GITHUB_OUTPUT
              echo "ℹ️ No changes in SQL file"
            else
              echo "changes=true" >> $GITHUB_OUTPUT
              echo "✅ Changes detected in SQL file"
              git diff --stat data/food.sql
            fi
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      # 7. 🔧 修复：先拉取远程最新代码，再提交
      - name: Pull latest changes with stashing
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          echo "Stashing local changes before pulling"
          git stash push -m "auto-stash before pull"
          git pull origin ${{ github.head_ref || github.ref_name }} --rebase
          echo "Restoring stashed changes after rebase"
          git stash pop || echo "No stash to pop"

      # 8. 提交变更（修复：skip_fetch 改为 false）
      - name: Commit changes if any
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            [CI] Update data/food.sql from CSV
            
            - Generated from ${{ env.CSV_PATH || 'food-original.csv' }}
            - Auto-committed by GitHub Actions
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
          file_pattern: "data/food.sql"
          push_options: "--force-with-lease"
          # 🔧 关键修复：允许 fetch，避免远程有新提交导致推送失败
          skip_fetch: false
          skip_checkout: false

      # 9. 创建 Pull Request（如果是 Fork）
      - name: Create Pull Request (if on fork)
        if: github.event_name == 'push' && github.repository_owner != 'masqueradeeer' && steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[CI] Update data/food.sql from CSV"
          title: "chore: update food.sql from CSV"
          body: |
            ## 📊 SQL Update
            
            This PR updates `data/food.sql` with the latest data from `food-original.csv`.
            
            ### Changes
            - Updated SQL file with new/updated restaurant data
            - Auto-committed by GitHub Actions
            
            Please review the changes before merging.
          branch: "ci/update-sql-${{ github.run_number }}"
          base: ${{ github.head_ref || github.ref_name }}
          delete-branch: true

      # 10. 上传 SQL 文件作为 Artifact
      - name: Upload SQL artifact
        if: steps.changes.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: food-sql
          path: data/food.sql
          retention-days: 7

      # 11. 🔧 修复缩进：成功消息
      - name: Success message
        if: steps.changes.outputs.changes == 'true'
        run: |
          echo "✅ SQL file updated successfully!"
          echo "📁 File: data/food.sql"
          echo "📊 Records: $(grep -c 'INSERT INTO' data/food.sql || echo '0')"